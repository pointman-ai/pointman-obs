[package]
name = "obs"
version = "0.1.0"
edition = "2021"
description = "OBS for Pointman: a recording watchdog that tells you within a minute if the screen capture freezes."
license = "MIT"
repository = "https://github.com/pointman-ai/pointman-obs"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
libc = "0.2"
png = "0.17"
pointman-extension = { git = "https://github.com/pointman-ai/pointman-extension", rev = "d534ff202e24b802520e51a15ffefd78c0af1583" }
serde_json = "1"
sha2 = "0.10"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.25"

[dev-dependencies]
tempfile = "3"
toml = "0.8"

[profile.release]
strip = true
lto = true
